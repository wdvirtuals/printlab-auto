[project]
name = "printlab-auto"
version = "0.1.0"
description = "Telegram-controlled 3D print automation for Bambu Lab X1C"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot>=21.0",
    "paho-mqtt>=2.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
printlab = "printlab.main:main"
printclaw = "printlab.printclaw.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printlab"]

[tool.hatch.build.targets.sdist]
include = ["src/printlab"]

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
